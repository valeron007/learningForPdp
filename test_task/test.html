<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN">
<html>
    <head>
        <meta http-equiv="content-type" content="text/html; charset=utf-8">
        <title>Тестовое задание</title>
        <style>
            .main::after {
                content: "";
                display: table;
                clear: both;
            }
            .main > div {
                float: left;
                border: 3px solid #000; 
            }
            .left {
                width: 58%;
                height: 2000px;
            }
            .float {
                width: 38%;
                height: 400px;
            }
        </style>
    </head>
    <body>
        <div class="main">
            <div class="left">
            </div>
            <div class="float">
            </div>
        </div>
    </body>
</html>
